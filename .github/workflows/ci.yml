name: XTag checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:all
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: xtag-0.1.0
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            test-results/
            playwright-report/
